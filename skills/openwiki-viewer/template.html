<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenWiki Viewer</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --text: #1f2328; --muted: #656d76;
    --border: #d8dee4; --accent: #0969da; --code-bg: #f0f2f5; --active: #ddeeff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #151b23; --text: #e6edf3; --muted: #8b949e;
      --border: #30363d; --accent: #4493f8; --code-bg: #1c232c; --active: #16324f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; height: 100vh; }
  #side { width: 300px; min-width: 300px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; }
  #side header { padding: 14px 14px 8px; }
  #side h1 { font-size: 16px; margin: 0 0 8px; }
  #home { color: inherit; text-decoration: none; }
  #home:hover { color: var(--accent); }
  #search { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; }
  #nav { overflow-y: auto; padding: 4px 8px 20px; flex: 1; }
  details { margin: 2px 0; }
  summary { cursor: pointer; padding: 5px 6px; font-weight: 600; border-radius: 6px; }
  summary:hover { background: var(--active); }
  .group { margin: 6px 0 2px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  #nav a { display: block; padding: 4px 8px 4px 16px; margin-left: 6px; color: var(--text);
    text-decoration: none; border-radius: 6px; font-size: 14px; }
  #nav a:hover { background: var(--active); }
  #nav a.active { background: var(--active); color: var(--accent); font-weight: 600; }
  #built { padding: 8px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
  main { flex: 1; overflow-y: auto; }
  article { max-width: 880px; margin: 0 auto; padding: 28px 32px 80px; }
  .crumb { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  h1, h2, h3, h4 { line-height: 1.25; }
  h1 { font-size: 28px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  h2 { font-size: 21px; margin-top: 30px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  h3 { font-size: 17px; margin-top: 22px; }
  a { color: var(--accent); }
  code { background: var(--code-bg); padding: 2px 5px; border-radius: 4px;
    font: 13px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; }
  pre { background: var(--code-bg); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  table { border-collapse: collapse; margin: 14px 0; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; vertical-align: top; }
  th { background: var(--panel); text-align: left; }
  blockquote { margin: 12px 0; padding: 2px 14px; border-left: 4px solid var(--border); color: var(--muted); }
  .meta { color: var(--muted); font-size: 13px; margin: -6px 0 18px; }
  .tags span { display: inline-block; background: var(--code-bg); border-radius: 10px; padding: 1px 9px; margin: 0 4px 0 0; font-size: 12px; }
  .empty { color: var(--muted); padding: 40px 0; }
  @media (max-width: 760px) { body { flex-direction: column; height: auto; } #side { width: 100%; min-width: 0; max-height: 45vh; } }
</style>
</head>
<body>
<nav id="side">
  <header>
    <h1><a id="home" href="#" title="Back to the start page">OpenWiki Viewer</a></h1>
    <input id="search" type="search" placeholder="Filter pages..." autocomplete="off">
  </header>
  <div id="nav"></div>
  <div id="built"></div>
</nav>
<main><article id="doc"><p class="empty">Pick a page on the left.</p></article></main>

<script id="wiki-data" type="application/json">__WIKI_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("wiki-data").textContent);

// ---- page model -----------------------------------------------------------
function parseFrontmatter(md) {
  const m = /^---\r?\n([\s\S]*?)\r?\n---\r?\n?/.exec(md);
  const fm = {};
  if (!m) return { fm, body: md };
  let key = null;
  for (const line of m[1].split(/\r?\n/)) {
    const kv = /^([A-Za-z_][\w-]*):\s*(.*)$/.exec(line);
    if (kv) { key = kv[1]; fm[key] = kv[2]; }
  }
  return { fm, body: md.slice(m[0].length) };
}
const pages = new Map(); // "repo/path" -> page
for (const r of DATA.repos) {
  for (const p of r.pages) {
    const { fm, body } = parseFrontmatter(p.md);
    const first = /^#\s+(.+)$/m.exec(body);
    pages.set(r.name + "/" + p.path, {
      repo: r.name, path: p.path, fm, body,
      title: (fm.title || (first && first[1]) || p.path).replace(/^["']|["']$/g, ""),
    });
  }
}

// ---- markdown rendering (small, HTML-escaping, offline) --------------------
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function resolveLink(href, cur) {
  if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.startsWith("#")) return { ext: true, href };
  const [file, frag] = href.split("#");
  // A leading "/" means the repo root, where the wiki lives under openwiki/ ("/openwiki/a/b.md").
  const abs = file.startsWith("/");
  const parts = abs ? [cur.repo] : (cur.repo + "/" + cur.path).split("/");
  if (!abs) parts.pop();
  const segs = file.split("/");
  if (abs && segs[1] === "openwiki") segs.splice(1, 1);
  for (const seg of segs) {
    if (seg === "..") parts.pop(); else if (seg && seg !== ".") parts.push(seg);
  }
  const key = parts.join("/");
  const hit = [key, key + ".md"].find((k) => pages.has(k));
  if (hit) return { ext: false, href: "#" + hit, page: pages.get(hit) };
  return { ext: false, href: "#", missing: true };
}

function inline(s, cur) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = esc(s);
  // [[/openwiki/path/page.md]] or [[path|label]] wikilinks
  s = s.replace(/\[\[([^\][|]+?)(?:\|([^\]]+?))?\]\]/g, (_, target, label) => {
    const t = target.trim().replace(/&amp;/g, "&");
    let r = resolveLink(t, cur);
    if (r.missing && !t.startsWith("/")) r = resolveLink("/" + t, cur); // wiki-root relative
    const text = label || (r.page ? esc(r.page.title) : target.trim());
    return `<a href="${esc(r.href)}"${r.missing ? ' title="page not found"' : ""}>${text}</a>`;
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, text, href) => {
    const r = resolveLink(href.replace(/&amp;/g, "&"), cur);
    if (r.ext) return `<a href="${esc(r.href)}" target="_blank" rel="noopener">${text}</a>`;
    return `<a href="${esc(r.href)}"${r.missing ? ' title="page not found"' : ""}>${text}</a>`;
  });
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[+i]) + "</code>");
}

function splitRow(line) {
  let t = line.trim();
  if (t.startsWith("|")) t = t.slice(1);
  if (t.endsWith("|")) t = t.slice(0, -1);
  const cells = []; let cur = "";
  for (let i = 0; i < t.length; i++) {
    if (t[i] === "\\" && t[i + 1] === "|") { cur += "|"; i++; }
    else if (t[i] === "|") { cells.push(cur.trim()); cur = ""; }
    else cur += t[i];
  }
  cells.push(cur.trim());
  return cells;
}

function render(md, cur) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let i = 0;
  const isBlank = (l) => /^\s*$/.test(l);
  const listRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;

  function parseList(indent) {
    const ordered = /\d/.test(listRe.exec(lines[i])[2]);
    const tag = ordered ? "ol" : "ul";
    let html = `<${tag}>`;
    while (i < lines.length) {
      const m = listRe.exec(lines[i]);
      if (!m || m[1].length < indent) break;
      if (m[1].length > indent) { html = html.replace(/<\/li>$/, "") + parseList(m[1].length) + "</li>"; continue; }
      let text = m[3]; i++;
      while (i < lines.length && !isBlank(lines[i]) && !listRe.test(lines[i]) && /^\s+\S/.test(lines[i])) { text += " " + lines[i].trim(); i++; }
      html += `<li>${inline(text, cur)}</li>`;
    }
    return html + `</${tag}>`;
  }

  while (i < lines.length) {
    const line = lines[i];
    if (isBlank(line)) { i++; continue; }
    const fence = /^```(\w*)/.exec(line);
    if (fence) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2], cur)}</h${h[1].length}>`); i++; continue; }
    if (/^(-{3,}|\*{3,})\s*$/.test(line)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      const head = splitRow(line); i += 2;
      let html = "<table><thead><tr>" + head.map((c) => `<th>${inline(c, cur)}</th>`).join("") + "</tr></thead><tbody>";
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        html += "<tr>" + splitRow(lines[i]).map((c) => `<td>${inline(c, cur)}</td>`).join("") + "</tr>"; i++;
      }
      out.push(html + "</tbody></table>");
      continue;
    }
    if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ""));
      out.push(`<blockquote>${inline(buf.join(" "), cur)}</blockquote>`);
      continue;
    }
    const lm = listRe.exec(line);
    if (lm) { out.push(parseList(lm[1].length)); continue; }
    const buf = [];
    while (i < lines.length && !isBlank(lines[i]) && !/^(```|#{1,4}\s|>\s?|\s*\|)/.test(lines[i]) && !listRe.test(lines[i])) buf.push(lines[i++].trim());
    if (!buf.length) { buf.push(lines[i++]); }
    out.push(`<p>${inline(buf.join(" "), cur)}</p>`);
  }
  return out.join("\n");
}

// ---- navigation -------------------------------------------------------------
const navEl = document.getElementById("nav");
const docEl = document.getElementById("doc");
const searchEl = document.getElementById("search");
document.getElementById("built").textContent = "Built " + new Date(DATA.built).toLocaleString();

const GROUP_ORDER = ["", "architecture", "concepts", "workflows", "integrations", "operations", "security", "testing"];

function buildNav(filter) {
  const f = filter.trim().toLowerCase();
  navEl.textContent = "";
  for (const r of DATA.repos) {
    const items = [...pages.values()].filter((p) => p.repo === r.name &&
      (!f || p.title.toLowerCase().includes(f) || p.path.toLowerCase().includes(f) || p.body.toLowerCase().includes(f)));
    if (!items.length) continue;
    const det = document.createElement("details");
    // Collapsed by default; expanded while filtering or when it holds the open page.
    det.open = !!f || location.hash.slice(1).startsWith(r.name + "/");
    const sum = document.createElement("summary");
    sum.textContent = r.name + " (" + items.length + ")";
    det.appendChild(sum);
    const groups = new Map();
    for (const p of items) {
      const g = p.path.includes("/") ? p.path.split("/")[0] : "";
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(p);
    }
    const order = [...groups.keys()].sort((a, b) => {
      const ia = GROUP_ORDER.indexOf(a), ib = GROUP_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
    });
    for (const g of order) {
      if (g) { const gl = document.createElement("div"); gl.className = "group"; gl.textContent = g; det.appendChild(gl); }
      groups.get(g).sort((a, b) => (a.path.endsWith("index.md") ? -1 : 0) - (b.path.endsWith("index.md") ? -1 : 0) || a.title.localeCompare(b.title));
      for (const p of groups.get(g)) {
        const a = document.createElement("a");
        a.href = "#" + p.repo + "/" + p.path;
        a.textContent = p.path.endsWith("index.md") ? "Index" + (g ? " (" + g + ")" : "") : p.title;
        a.dataset.key = p.repo + "/" + p.path;
        det.appendChild(a);
      }
    }
    navEl.appendChild(det);
  }
  markActive();
}

function markActive() {
  const key = decodeURIComponent(location.hash.slice(1));
  for (const a of navEl.querySelectorAll("a")) {
    const on = a.dataset.key === key;
    a.classList.toggle("active", on);
    if (on) a.closest("details").open = true;
  }
}

function show() {
  const key = decodeURIComponent(location.hash.slice(1));
  const p = pages.get(key);
  markActive();
  if (!p) {
    document.title = "OpenWiki Viewer";
    document.querySelector("main").scrollTop = 0;
    docEl.innerHTML = key ? '<p class="empty">Page not found.</p>' : '<p class="empty">Pick a repo on the left, then a page.</p>';
    return;
  }
  const tags = (p.fm.tags || "").replace(/^\[|\]$/g, "").split(",").map((t) => t.trim()).filter(Boolean);
  const bodyNoTitle = p.body.replace(/^\s*#\s+.+\n/, "");
  docEl.innerHTML =
    `<div class="crumb">${esc(p.repo)} / ${esc(p.path)}</div><h1>${esc(p.title)}</h1>` +
    (p.fm.type ? `<div class="meta">${esc(p.fm.type)}${tags.length ? ' &middot; <span class="tags">' + tags.map((t) => `<span>${esc(t)}</span>`).join("") + "</span>" : ""}</div>` : "") +
    render(bodyNoTitle, p);
  document.title = p.title + " - " + p.repo;
  document.querySelector("main").scrollTop = 0;
}

searchEl.addEventListener("input", () => buildNav(searchEl.value));
// Clicking the title returns to the start page: clear filter, collapse everything, no page open.
document.getElementById("home").addEventListener("click", (e) => {
  e.preventDefault();
  searchEl.value = "";
  history.pushState(null, "", location.pathname + location.search);
  buildNav("");
  show();
});
window.addEventListener("hashchange", show);
buildNav("");
show();
</script>
</body>
</html>
